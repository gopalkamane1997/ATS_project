<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ATS Resume Analyzer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 16px;
        }

        .container {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 28px rgba(0,0,0,0.09);
            padding: 40px;
            width: 100%;
            max-width: 760px;
        }

        /* ── Header ── */
        .header { margin-bottom: 32px; }
        .header h1 { font-size: 1.9rem; color: #2d3748; margin-bottom: 6px; }
        .header p  { color: #718096; font-size: 0.95rem; }

        /* ── Form ── */
        .section-card {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .section-card .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #a0aec0;
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 0.92rem;
            resize: vertical;
            min-height: 130px;
            outline: none;
            transition: border 0.2s;
            background: #fff;
            color: #2d3748;
        }
        textarea:focus { border-color: #667eea; }
        /* ── File Input ── */
        input[type="file"] { display: none; }
        .file-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
            cursor: pointer;
        }
        .file-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: #667eea;
            color: #fff;
            border-radius: 7px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .file-label:hover .file-btn { background: #5a67d8; }
        .file-name {
            font-size: 0.85rem;
            color: #718096;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ── Buttons ── */
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }
        .btn-analyze {
            flex: 1;
            padding: 14px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-analyze:hover    { background: #5a67d8; }
        .btn-analyze:disabled { background: #a0aec0; cursor: not-allowed; }
        .btn-refresh {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 14px 20px;
            background: #fff;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
        }
        .btn-refresh:hover { background: #667eea; color: #fff; }

        /* ── Spinner ── */
        .spinner {
            display: none;
            text-align: center;
            padding: 24px 0;
            color: #667eea;
            font-weight: 600;
        }

        /* ── Results ── */
        #result { margin-top: 32px; display: none; }

        .result-header {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #a0aec0;
            margin-bottom: 14px;
        }

        /* Score card */
        .score-card {
            display: flex;
            align-items: center;
            gap: 24px;
            background: linear-gradient(135deg, #667eea 0%, #5a67d8 100%);
            border-radius: 12px;
            padding: 24px 28px;
            margin-bottom: 16px;
            color: #fff;
        }
        .score-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .score-number { font-size: 1.7rem; font-weight: 800; line-height: 1; }
        .score-pct    { font-size: 0.75rem; opacity: 0.85; }
        .score-meta h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
        .score-meta p  { font-size: 0.88rem; opacity: 0.85; }

        /* Analysis sections */
        .analysis-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        @media (max-width: 560px) { .analysis-grid { grid-template-columns: 1fr; } }

        .analysis-card {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 18px 20px;
        }
        .analysis-card .card-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            margin-bottom: 12px;
        }
        .analysis-card.keywords .card-title { color: #c05621; }
        .analysis-card.suggestions .card-title { color: #276749; }

        .analysis-card ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .analysis-card ul li {
            font-size: 0.85rem;
            color: #4a5568;
            padding: 6px 0 6px 20px;
            border-bottom: 1px solid #edf2f7;
            line-height: 1.4;
            position: relative;
        }
        .analysis-card ul li:last-child { border-bottom: none; }
        .analysis-card.keywords li::before {
            content: "";
            position: absolute;
            left: 4px;
            top: 12px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #e53e3e;
        }
        .analysis-card.suggestions li::before {
            content: "";
            position: absolute;
            left: 4px;
            top: 12px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #38a169;
        }

        /* Raw / fallback section */
        .raw-card {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
        }
        .raw-card .card-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: #a0aec0;
            margin-bottom: 12px;
        }
        .raw-card p {
            font-size: 0.88rem;
            color: #4a5568;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Error */
        .error-box {
            background: #fff5f5;
            border-left: 4px solid #fc8181;
            border-radius: 8px;
            padding: 16px 20px;
            color: #c53030;
            font-size: 0.92rem;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- Header -->
    <div class="header">
        <h1>ATS Resume Analyzer</h1>
        <p>Upload your resume and paste a job description to get an AI-powered match analysis.</p>
    </div>

    <!-- Upload section -->
    <div class="section-card">
        <div class="section-title">Step 1 — Upload Resume</div>
        <form id="atsForm">
            <div style="margin-bottom:20px;">
                <label>Resume (PDF)</label>
                <label class="file-label" for="resume">
                    <span class="file-btn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        Choose File
                    </span>
                    <span class="file-name" id="fileName">No file chosen</span>
                </label>
                <input type="file" id="resume" name="file" accept=".pdf" required />
            </div>

            <div style="margin-bottom:20px;">
                <label for="jd">Job Description</label>
                <textarea id="jd" name="job_description" placeholder="Paste the job description here..." required></textarea>
            </div>

            <div class="btn-row">
                <button type="submit" id="submitBtn" class="btn-analyze">Analyze Resume</button>
                <button type="button" id="refreshBtn" class="btn-refresh">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                    New Analysis
                </button>
            </div>
        </form>
    </div>

    <!-- Spinner -->
    <div class="spinner" id="spinner">Analyzing your resume, please wait...</div>

    <!-- Results -->
    <div id="result"></div>

</div>

<script>
    const form       = document.getElementById('atsForm');
    const resultDiv  = document.getElementById('result');
    const spinner    = document.getElementById('spinner');
    const submitBtn  = document.getElementById('submitBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const fileInput  = document.getElementById('resume');
    const fileName   = document.getElementById('fileName');

    fileInput.addEventListener('change', () => {
        fileName.textContent = fileInput.files[0] ? fileInput.files[0].name : 'No file chosen';
    });

    refreshBtn.addEventListener('click', () => {
        resultDiv.style.display = 'none';
        resultDiv.innerHTML = '';
        refreshBtn.style.display = 'none';
        form.reset();
        fileName.textContent = 'No file chosen';
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        resultDiv.style.display = 'none';
        resultDiv.innerHTML = '';
        spinner.style.display = 'block';
        submitBtn.disabled = true;

        const formData = new FormData();
        formData.append('file', document.getElementById('resume').files[0]);
        formData.append('job_description', document.getElementById('jd').value);

        try {
            const response = await fetch('/analyze', { method: 'POST', body: formData });
            const data = await response.json();

            spinner.style.display = 'none';
            resultDiv.style.display = 'block';

            if (data.status === 'success') {
                const score   = data.gemini_match_score;
                const rawText = data.gemini_analysis || '';

                // Determine score bar label
                let scoreLabel = 'Needs Improvement';
                if (score >= 80) scoreLabel = 'Strong Match';
                else if (score >= 60) scoreLabel = 'Good Match';
                else if (score >= 40) scoreLabel = 'Moderate Match';

                // Parse sections from Gemini text
                const keywords    = extractSection(rawText, /missing\s+keywords?/i);
                const suggestions = extractSection(rawText, /suggestions?/i);

                // Remaining text after removing parsed sections
                const remainder = stripSections(rawText, [/missing\s+keywords?/i, /suggestions?/i]);

                resultDiv.innerHTML = `
                    <div class="result-header">Step 2 — Analysis Results</div>

                    <!-- Score Card -->
                    <div class="score-card">
                        <div class="score-circle">
                            <span class="score-number">${score !== null ? score : '–'}</span>
                            <span class="score-pct">${score !== null ? '%' : 'N/A'}</span>
                        </div>
                        <div class="score-meta">
                            <h2>AI Match Score</h2>
                            <p>${score !== null ? scoreLabel : 'Score could not be determined'}</p>
                        </div>
                    </div>

                    <!-- Keywords & Suggestions Grid -->
                    <div class="analysis-grid">
                        <div class="analysis-card keywords">
                            <div class="card-title">Missing Keywords</div>
                            ${renderList(keywords, 'No missing keywords identified.')}
                        </div>
                        <div class="analysis-card suggestions">
                            <div class="card-title">Suggestions</div>
                            ${renderList(suggestions, 'No suggestions provided.')}
                        </div>
                    </div>

                    <!-- Full AI Response -->
                    ${remainder.trim() ? `
                    <div class="raw-card">
                        <div class="card-title">Full AI Response</div>
                        <p>${escapeHtml(remainder.trim())}</p>
                    </div>` : ''}
                `;
            } else {
                resultDiv.innerHTML = `<div class="error-box"><strong>Error:</strong> ${escapeHtml(data.message)}</div>`;
            }
        } catch (err) {
            spinner.style.display = 'none';
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `<div class="error-box"><strong>Request failed:</strong> ${escapeHtml(err.message)}</div>`;
        } finally {
            submitBtn.disabled = false;
            refreshBtn.style.display = 'flex';
        }
    });

    /**
     * Extract bullet lines under a section heading matched by `regex`.
     * Returns an array of strings.
     */
    function extractSection(text, regex) {
        const lines = text.split('\n');
        const items = [];
        let inside = false;
        for (const line of lines) {
            if (regex.test(line)) { inside = true; continue; }
            // Stop when a new heading-like line is hit
            if (inside && /^#{1,3}\s|^\*\*[^*]+\*\*\s*$|^[A-Z][^a-z]{2,}:/.test(line.trim()) && line.trim()) { inside = false; }
            if (inside) {
                const clean = line.replace(/^[-*•✕→\d.]+\s*/, '').trim();
                if (clean) items.push(clean);
            }
        }
        return items;
    }

    /** Remove lines belonging to known sections so we don't double-render them. */
    function stripSections(text, regexes) {
        const lines = text.split('\n');
        const result = [];
        let skip = false;
        for (const line of lines) {
            if (regexes.some(r => r.test(line))) { skip = true; continue; }
            if (skip && /^#{1,3}\s|^\*\*[^*]+\*\*\s*$|^[A-Z][^a-z]{2,}:/.test(line.trim()) && line.trim()) skip = false;
            if (!skip) result.push(line);
        }
        return result.join('\n');
    }

    function renderList(items, emptyMsg) {
        if (!items.length) return `<p style="font-size:0.85rem;color:#a0aec0;">${emptyMsg}</p>`;
        return `<ul>${items.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>`;
    }

    function escapeHtml(text) {
        return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
</script>
</body>
</html>
